<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Positions Page</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --bg-color: #f3f4f6;
      --text-color: #333;
      --card-bg: #fff;
      --pe-bg: #76f65c;
      --ce-bg: #ff0707;
    }

    body.dark {
      --bg-color: url('https://images.unsplash.com/photo-1642468742436-7bbdb37cddc3?auto=format&fit=crop&w=1920&q=60');
      --text-color: #fff;
      --card-bg: rgba(255,255,255,0.08);
    }

    body {
      font-family: "Segoe UI", sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }

    .overlay {
      background: rgba(0,0,0,0.6);
      min-height: 100vh;
      padding: 30px 40px;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .trade-header {
      font-weight: 600;
      font-size: 28px;
    }

    .theme-toggle {
      cursor: pointer;
      font-size: 20px;
      padding: 6px 12px;
      border-radius: 6px;
      border: none;
      background: rgba(255,255,255,0.15);
      color: var(--text-color);
      transition: 0.3s;
    }

    .theme-toggle:hover {
      background: rgba(255,255,255,0.25);
    }

    .button-row {
      display: flex;
      gap: 12px;
      margin-bottom: 25px;
    }

    .action-btn {
      text-decoration: none;
      background: #007bff;
      color: white;
      padding: 10px 25px;
      border-radius: 6px;
      font-weight: bold;
      transition: 0.3s;
      text-align: center;
    }

    .action-btn:hover {
      background: #0062cc;
    }

    .client-card {
      background: var(--card-bg);
      padding: 20px;
      margin-bottom: 25px;
      border-radius: 10px;
    }

    .client-title {
      font-weight: 600;
      font-size: 18px;
      margin-bottom: 15px;
      color: var(--text-color);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      color: var(--text-color);
    }

    table th, table td {
      padding: 10px;
      text-align: center;
      border: 1px solid rgba(0,0,0,0.1);
    }

    table th {
      background: rgba(0,0,0,0.05);
    }

    td.pe { background-color: var(--pe-bg); color: #000; }
    td.ce { background-color: var(--ce-bg); color: #000; }

    @media (max-width: 768px) {
      .header-row {
        flex-direction: column;
        gap: 10px;
      }
      .button-row {
        flex-wrap: wrap;
      }
    }
  </style>
</head>
<body>
  <div class="overlay">
    <div class="header-row">
      <h3 class="trade-header">Positions Overview</h3>
      <button class="theme-toggle" id="themeToggle">🌙</button>
    </div>

    <div class="button-row">
      <a href="{% url 'home' %}" class="action-btn">HOME</a>
    </div>

    {% comment %} tables and client_list must be same length {% endcomment %}
    {% for client, table in rows %}
    <div class="client-card">
      <div class="client-title">{{ client }}</div>
      {{ table|safe }}
    </div>
    {% endfor %}
  </div>
<!-- <button id="updateLtpBtn" class="action-btn">Update LTP Now</button> -->
  <script>
    // Theme toggle
    const toggleBtn = document.getElementById('themeToggle');
    const currentTheme = localStorage.getItem('theme');
    if(currentTheme === 'dark') document.body.classList.add('dark');

    toggleBtn.addEventListener('click', () => {
      document.body.classList.toggle('dark');
      localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light');
      toggleBtn.textContent = document.body.classList.contains('dark') ? '🌞' : '🌙';
    });
    toggleBtn.textContent = document.body.classList.contains('dark') ? '🌞' : '🌙';

    // Color PE/CE columns dynamically
    const cells = document.getElementsByTagName("td");
    for (let i = 0; i < cells.length; i++) {
      if (cells[i].innerHTML == "PE") {
        cells[i].classList.add("pe");
        if(cells[i+1]) cells[i+1].classList.add("pe");
        if(cells[i-1]) cells[i-1].classList.add("pe");
      } else if (cells[i].innerHTML == "CE") {
        cells[i].classList.add("ce");
        if(cells[i+1]) cells[i+1].classList.add("ce");
        if(cells[i-1]) cells[i-1].classList.add("ce");
      }
    }
    async function updateLTPs() {
      const rows = document.querySelectorAll("tr[data-token]");
      const payload = [];

      rows.forEach(row => {
          payload.push({
              token: row.dataset.token,
              exchange: row.dataset.exchange,
              account: row.dataset.account
          });
      });

      const response = await fetch("{% url 'get_ltp' %}", {
          method: "POST",
          headers: {
              "Content-Type": "application/json",
              "X-CSRFToken": "{{ csrf_token }}"
          },
          body: JSON.stringify({ positions: payload })
      });

      const ltp_data = await response.json();  
      // EXAMPLE RETURN:
      // { "12345_NSE_ClientA": 196.25, ... }

      rows.forEach(row => {
          const key = `${row.dataset.token}_${row.dataset.exchange}_${row.dataset.account}`;
          const ltpCell = row.querySelector(".ltp-value");
          if (ltp_data[key] !== undefined) {
              ltpCell.textContent = ltp_data[key];
          }
      });
    }

    // Update every 10 seconds
    setInterval(updateLTPs, 10000);
    //document.getElementById("updateLtpBtn").addEventListener("click", updateLTPs);


  </script>

</body>
</html>
